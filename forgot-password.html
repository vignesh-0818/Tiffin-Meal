<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>TiffinBox - Forgot Password</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link href="css/style.css" rel="stylesheet"/>
<style>
body {
    background-color: var(--bg-secondary);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
}

.auth-wrapper {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1rem;
}

.auth-card {
    background: var(--bg-primary);
    border-radius: 16px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.05);
    border: 1px solid var(--border-color);
    width: 100%;
    max-width: 500px;
    padding: 2.5rem;
}

body.dark-mode .auth-card {
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
}

.top-controls {
    position: absolute;
    top: 1rem;
    right: 1rem;
    display: flex;
    gap: 0.5rem;
}

[dir="rtl"] .top-controls {
    right: auto;
    left: 1rem;
}

.input-icon-wrapper {
    display: flex;
    align-items: center;
}

.input-icon-wrapper:focus-within {
    border-color: #86b7fe !important;
    box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.25) !important;
}

.input-icon-wrapper i {
    flex-shrink: 0;
}

.input-icon-wrapper input {
    flex: 1;
    height: 100%;
}

.btn-blue-custom {
    background-color: #3b82f6;
    border-color: #3b82f6;
    color: white;
}
.btn-blue-custom:hover {
    background-color: #2563eb;
    border-color: #2563eb;
    color: white;
}

@media (max-width: 576px) {
    .auth-card {
        padding: 1.5rem;
    }
}
</style>
</head>
<body class="dark-mode">

<div class="top-controls">
    <button class="theme-toggle-btn btn btn-outline-secondary" onclick="toggleTheme()" title="Toggle Theme" style="border-radius:8px;width:45px;height:40px;display:flex;align-items:center;justify-content:center;background:var(--bg-primary);border-color:var(--border-color);">
        <i class="fas fa-moon" style="color:var(--text-primary);"></i>
    </button>
    <button class="rtl-toggle-btn btn btn-outline-secondary" onclick="toggleRTL()" title="Toggle RTL" style="border-radius:8px;width:75px;height:40px;display:flex;align-items:center;justify-content:center;background:var(--bg-primary);border-color:var(--border-color);font-weight:600;font-size:0.85rem;gap:6px;color:var(--text-primary);">
        <i class="fas fa-font"></i> RTL
    </button>
</div>

<div class="auth-wrapper">
    <div class="auth-card">
        <h2 class="fw-bold mb-3" style="font-family:'Inter',sans-serif;color:var(--text-primary);">Forgot your password?</h2>
        <p class="mb-4" style="color:var(--text-secondary);font-size:1.05rem;">Enter the email linked to your account and we will send a reset link.</p>

        <form id="forgotPasswordForm" autocomplete="off" onsubmit="handleForgotPassword(event)">
            
            <div class="mb-4">
                <label class="form-label fw-bold" style="color:var(--text-primary);font-size:0.95rem;">Email address <span class="text-danger">*</span></label>
                <div class="input-icon-wrapper form-control p-0 overflow-hidden" style="background:var(--bg-secondary);border-color:var(--border-color);">
                    <i class="far fa-envelope ms-3 me-2 text-secondary"></i>
                    <input type="email" id="resetEmail" name="email" class="border-0 bg-transparent shadow-none" style="color:var(--text-primary);padding-top:0.6rem;padding-bottom:0.6rem;outline:none;" placeholder="you@example.com" required>
                </div>
                <div class="text-danger small mt-1 d-none" id="emailError">Please enter a valid email address.</div>
            </div>
            
            <button class="btn btn-blue-custom w-100 py-2 rounded-pill fw-bold mb-4" type="submit" style="font-size:1.05rem;box-shadow:0 4px 14px rgba(59, 130, 246, 0.4);">
                <i class="fas fa-key me-2"></i> Send Reset Link
            </button>
            
            <div id="successMessage" class="alert alert-success d-none text-center" role="alert">
                Reset link sent successfully.
            </div>

            <div class="text-center">
                <span style="color:var(--text-secondary);">Remembered it?</span> 
                <a href="customer-login.html" id="backToLoginLink" style="color:#3b82f6;text-decoration:none;">Back to login</a>
            </div>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/main.js"></script>
<script src="js/auth.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const urlParams = new URLSearchParams(window.location.search);
        const role = urlParams.get('role');
        const backLink = document.getElementById('backToLoginLink');
        
        if (role === 'admin') {
            backLink.href = 'admin-login.html';
        } else if (role === 'customer') {
            backLink.href = 'customer-login.html';
        } else if (document.referrer.includes('admin-login.html')) {
            backLink.href = 'admin-login.html';
        } else if (document.referrer.includes('customer-login.html')) {
            backLink.href = 'customer-login.html';
        }
    });
</script>
</body>
</html>

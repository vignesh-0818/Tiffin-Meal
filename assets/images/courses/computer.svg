<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f2ff"/>
      <stop offset="1" stop-color="#ecfeff"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset=".6" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <g opacity=".5">
    <circle cx="110" cy="70" r="130" fill="#ede9fe"/>
    <circle cx="720" cy="400" r="150" fill="#cffafe"/>
  </g>
  <g transform="translate(280 100)">
    <rect x="-10" y="-10" width="260" height="180" rx="24" fill="#fff" stroke="#e9e4fa" stroke-width="3"/>
    <rect width="240" height="160" rx="16" fill="url(#brand)"/>
    <rect x="24" y="24" width="192" height="12" rx="6" fill="#fff" opacity=".35"/>
    <g transform="translate(40 66)">
      <text x="0" y="20" font-family="Consolas, monospace" font-weight="700" font-size="17" fill="#fff">
        <tspan x="0" dy="0">&lt;h1&gt;</tspan>
        <tspan x="14" dy="20">print("Hello")</tspan>
        <tspan x="14" dy="20">while run: learn()</tspan>
        <tspan x="0" dy="20">&lt;/h1&gt;</tspan>
      </text>
    </g>
  </g>
  <g transform="translate(580 260)">
    <rect width="150" height="120" rx="20" fill="#fff" stroke="#e9e4fa" stroke-width="2.5"/>
    <rect x="20" y="20" width="110" height="10" rx="5" fill="#ede9fe"/>
    <rect x="20" y="44" width="82" height="10" rx="5" fill="#e9e4fa"/>
    <rect x="20" y="84" width="110" height="10" rx="5" fill="#f3ecff"/>
    <rect x="20" y="84" width="66" height="10" rx="5" fill="#7c3aed" opacity=".8"/>
  </g>
  <text x="210" y="400" font-family="Consolas, monospace" font-weight="700" font-size="26" fill="url(#gold)" text-anchor="middle">&lt;/&gt;</text>
  <circle cx="600" cy="150" r="7" fill="#0d9488"/>
</svg>

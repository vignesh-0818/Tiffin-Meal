<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>TiffinBox - Admin Login</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link href="css/style.css" rel="stylesheet"/>
<style>
body {
    background-color: var(--bg-secondary);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
}

.auth-wrapper {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1rem;
}

.auth-card {
    background: var(--bg-primary);
    border-radius: 16px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.05);
    border: 1px solid var(--border-color);
    width: 100%;
    max-width: 500px;
    padding: 2.5rem;
}

body.dark-mode .auth-card {
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
}

.auth-header {
    text-align: center;
    margin-bottom: 2rem;
}

.auth-logo {
    color: var(--primary);
    font-size: 2rem;
    margin-bottom: 1rem;
    display: inline-block;
    text-decoration: none;
    font-family: 'Playfair Display', serif;
    font-weight: 700;
}
.auth-logo:hover {
    color: var(--primary-dark);
}

/* Segmented Control Styles */
.auth-switch-container {
    display: flex;
    background: var(--bg-secondary);
    border-radius: 8px;
    padding: 4px;
    margin-bottom: 2rem;
    border: 1px solid var(--border-color);
}
.auth-switch-btn {
    flex: 1;
    text-align: center;
    padding: 0.6rem 1rem;
    border-radius: 6px;
    text-decoration: none;
    font-weight: 600;
    font-size: 0.95rem;
    color: var(--text-secondary);
    transition: all 0.3s ease;
}
.auth-switch-btn:hover:not(.active) {
    background: rgba(0,0,0,0.05);
    color: var(--text-primary);
}
body.dark-mode .auth-switch-btn:hover:not(.active) {
    background: rgba(255,255,255,0.05);
}
.auth-switch-btn.active {
    background: var(--primary);
    color: white;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
}

.top-controls {
    position: absolute;
    top: 1rem;
    right: 1rem;
    display: flex;
    gap: 0.5rem;
}

[dir="rtl"] .top-controls {
    right: auto;
    left: 1rem;
}

.input-icon-wrapper {
    position: relative;
}

.input-icon-wrapper > i.fa-solid, .input-icon-wrapper > i.fas {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-secondary);
}

[dir="ltr"] .input-icon-wrapper > i.fa-solid, [dir="ltr"] .input-icon-wrapper > i.fas {
    left: 1rem;
}
[dir="rtl"] .input-icon-wrapper > i.fa-solid, [dir="rtl"] .input-icon-wrapper > i.fas {
    right: 1rem;
}

[dir="ltr"] .input-icon-wrapper input {
    padding-left: 2.75rem;
}
[dir="rtl"] .input-icon-wrapper input {
    padding-right: 2.75rem;
}

.toggle-password {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    cursor: pointer;
    color: var(--text-secondary);
    background: none;
    border: none;
    padding: 0;
}

[dir="ltr"] .toggle-password {
    right: 1rem;
}
[dir="rtl"] .toggle-password {
    left: 1rem;
}

@media (max-width: 576px) {
    .auth-card {
        padding: 1.5rem;
    }
}
</style>
    <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
</head>
<body>

<div class="top-controls">
    <button class="theme-toggle-btn btn btn-outline-secondary" onclick="toggleTheme()" title="Toggle Theme" style="border-radius:50%;width:40px;height:40px;display:flex;align-items:center;justify-content:center;">
        <i class="fas fa-moon"></i>
    </button>
    <button class="rtl-toggle-btn btn btn-outline-secondary" onclick="toggleRTL()" title="Toggle RTL" style="border-radius:50%;width:40px;height:40px;display:flex;align-items:center;justify-content:center;">
        <i class="fas fa-align-right"></i>
    </button>
</div>

<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-header">
            <a href="index.html" class="auth-logo"><i class="fas fa-utensils"></i> TiffinBox</a>
            <h2 class="fw-bold" style="font-family:'Playfair Display',serif;color:var(--text-primary);">Admin Login</h2>
            <p style="color:var(--text-secondary);">Restricted access for TiffinBox administrators.</p>
        </div>

        <div class="auth-switch-container">
            <a href="customer-login.html" class="auth-switch-btn ">Customer Login</a>
            <a href="admin-login.html" class="auth-switch-btn active">Admin Login</a>
        </div>

        <form autocomplete="off" onsubmit="handleAdminLogin(event)">
            
            <div class="mb-3">
                <label class="form-label fw-semibold" style="color:var(--text-primary);">Admin Email</label>
                <div class="input-icon-wrapper">
                    <i class="fas fa-user-shield"></i>
                    <input type="email" name="email" class="form-control" placeholder="Admin Email" required>
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold" style="color:var(--text-primary);">Password</label>
                <div class="input-icon-wrapper">
                    <i class="fas fa-lock"></i>
                    <input type="password" name="password" class="form-control" placeholder="Password" required>
                    <button type="button" class="toggle-password" onclick="togglePasswordVisibility(this)" title="Toggle password visibility">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
            </div>
            <div class="d-flex justify-content-between align-items-center mb-2 mt-3">
                <div class="form-check">
                    <input type="checkbox" class="form-check-input" id="rememberAdmin" name="remember">
                    <label class="form-check-label small" for="rememberAdmin" style="color:var(--text-secondary);">Remember Me</label>
                </div>
                <a href="forgot-password.html?role=admin" style="font-size:0.9rem;color:var(--primary);text-decoration:none;">Forgot Password?</a>
            </div>
            <button class="btn btn-primary-custom w-100 py-2 mt-3 rounded-pill fw-bold" type="submit">Admin Login</button>
        </form>

        <div class="d-flex align-items-center my-4">
            <hr class="flex-grow-1" style="border-color: var(--border-color); opacity: 0.5;">
            <span class="mx-3" style="color: var(--text-secondary); font-size: 0.9rem;">or continue with</span>
            <hr class="flex-grow-1" style="border-color: var(--border-color); opacity: 0.5;">
        </div>

        <div class="row g-3 mb-4">
            <div class="col-6">
                <button type="button" class="btn w-100 rounded-pill d-flex align-items-center justify-content-center gap-2" style="background: var(--bg-primary); border: 1px solid var(--border-color); color: var(--text-primary); transition: all 0.3s ease; padding: 0.6rem 1rem;" onclick="alert('Google authentication is not yet configured.')" onmouseover="this.style.background='rgba(0,0,0,0.02)'" onmouseout="this.style.background='var(--bg-primary)'">
                    <i class="fab fa-google text-danger"></i>
                    <span class="fw-semibold">Google</span>
                </button>
            </div>
            <div class="col-6">
                <button type="button" class="btn w-100 rounded-pill d-flex align-items-center justify-content-center gap-2" style="background: var(--bg-primary); border: 1px solid var(--border-color); color: var(--text-primary); transition: all 0.3s ease; padding: 0.6rem 1rem;" onclick="alert('Apple authentication is not yet configured.')" onmouseover="this.style.background='rgba(0,0,0,0.02)'" onmouseout="this.style.background='var(--bg-primary)'">
                    <i class="fab fa-apple" style="font-size: 1.1rem;"></i>
                    <span class="fw-semibold">Apple</span>
                </button>
            </div>
        </div>

        <div class="text-center">
            <span style="color:var(--text-secondary);">Need an admin account?</span> <a href="admin-register.html" style="color:var(--primary);font-weight:600;text-decoration:none;">Sign Up here</a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/main.js"></script>
<script src="js/auth.js"></script>
<script>
function togglePasswordVisibility(btn) {
    const input = btn.previousElementSibling;
    const icon = btn.querySelector('i');
    if (input.type === 'password') {
        input.type = 'text';
        icon.classList.remove('fa-eye');
        icon.classList.add('fa-eye-slash');
    } else {
        input.type = 'password';
        icon.classList.remove('fa-eye-slash');
        icon.classList.add('fa-eye');
    }
}
</script>
</body>
</html>
